name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint + compile + YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Compile all Python sources
        run: |
          python -m compileall -q pipeline annotation stats

      - name: Lint (errors only — undefined names, syntax errors)
        run: |
          flake8 pipeline annotation stats \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Validate YAML configs
        run: |
          python - <<'PY'
          import sys, pathlib, yaml
          failed = False
          for path in pathlib.Path("configs").glob("*.yaml"):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"OK   {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
